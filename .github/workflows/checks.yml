name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite backs the storage tests, so the Node version is load
          # bearing rather than incidental.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Bundle for iOS
        # Catches anything that typechecks but will not load on a device, such
        # as a bad asset path or a module Metro cannot resolve.
        run: npx expo export --platform ios --output-dir /tmp/deckhead-export
